<main>

 <section id="contato">
  <h2>Preencha suas informações</h2>

  <form>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" placeholder="Ex: Sophia Dias" required>

    <label for="idade">Idade</label>
    <input type="number" id="idade" name="idade" placeholder="Ex: 17" required>

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" placeholder="Ex: exemplo@email.com" required>

    <label for="cidade">Cidade</label>
    <input type="text" id="cidade" name="cidade" placeholder="Ex: Engenheiro Coelho">

    <label for="musica">Música favorita</label>
    <input type="text" id="musica" name="musica" placeholder="Qual música você mais gosta?">

    <label for="bio">Um pouco sobre você</label>
    <textarea id="bio" name="bio" placeholder="Escreva algo sobre você..." rows="4"></textarea>

    <label for="cor">Cor favorita</label>
    <input type="color" id="cor" name="cor">

    <button type="submit">Salvar biografia</button>

  </form>
</section>

</main>
